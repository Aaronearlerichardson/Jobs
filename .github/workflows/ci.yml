name: CI

# Every pull request (whatever branch it targets) and every push to main
# gets the full treatment: the offline test job, then the three-OS build.
# Builds only start if the tests pass (`needs: test`), and a new push to the
# same ref cancels the run in flight (see `concurrency`), so the expensive
# compile isn't spent on superseded work.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Belt and braces: the suite is offline by design, and an unset key makes
  # the scorers no-op. Anything that tries to reach the API fails loudly
  # instead of silently costing money.
  ANTHROPIC_API_KEY: ""
  PYTHONUTF8: "1"

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # Every version reports independently — one failing doesn't hide the
      # others, which is the whole point of testing a range.
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r envs/requirements-dev.txt

      - name: Confirm the run is profile-example + API-free
        # profile.toml is gitignored, so a clean checkout has none and
        # config.py falls back to the example. Assert that rather than
        # assume it: a stray committed profile would silently change what
        # the whole suite tests.
        run: |
          test ! -f profile.toml || { echo "profile.toml must not be committed"; exit 1; }
          python -c "
          import config
          assert config.PROFILE_SOURCE == 'profile.example.toml', config.PROFILE_SOURCE
          # No USABLE key: the placeholder (or anything blank, which config
          # resolves to the placeholder). Checking for a real key shape too,
          # so a leaked secret fails loudly rather than quietly spending.
          key = config.ANTHROPIC_API_KEY
          assert key == 'YOUR_ANTHROPIC_API_KEY_HERE', 'API key leaked into CI'
          assert not key.startswith('sk-'), 'API key leaked into CI'
          print('profile:', config.PROFILE_SOURCE, '| tracks:', list(config.UI_TRACKS))
          "

      - name: Byte-compile everything
        run: python -m compileall -q core scrapers discovery webapp *.py

      - name: Lint (undefined names / unused imports)
        run: python -m pyflakes core scrapers discovery webapp tests *.py

      - name: Validate the example profile
        run: |
          python -c "
          from src.config import profile_edit
          raw, src = profile_edit.read_raw()
          errs = profile_edit.validate(raw)
          print('validating', src)
          assert not errs, errs
          "

      - name: Test suite (pytest, offline)
        # testpaths covers tests/ AND the source trees, and addopts carries
        # --doctest-modules, so this one command runs the fixture suite, the
        # docstring doctests, and tests/test_invariants.py together.
        run: pytest -q --cov --cov-report=xml --cov-report=term

      - name: Doctests alone (docstring claims are enforced, not asserted)
        # The step above already ran these. Running them ALONE makes the
        # collected count visible in the log and turns an empty collection
        # into a failure: pytest exits 5 on "no tests collected", which
        # reads as a pass to anyone skimming a green run. See
        # docs/DOCSTRINGS.md for the rule these enforce.
        #
        # Paths are given explicitly (they override testpaths) so tests/ is
        # excluded and the number printed is doctests only.
        run: |
          SRC="src tools"
          MODS="build_app.py capture.py crawler.py discover.py harvest.py"
          MODS="$MODS run_scraper.py smoke_test.py webapp.py"
          # -o addopts=-q replaces pytest.ini's addopts rather than adding
          # to it: a second -q would make pytest -qq and swallow the very
          # "N passed" line this step greps for.
          pytest -o addopts=-q --doctest-modules $SRC $MODS > doctest.log 2>&1 || {
            cat doctest.log; exit 1;
          }
          cat doctest.log
          N=$(grep -Eo "^[0-9]+ passed" doctest.log | head -1)
          test -n "$N" || {
            echo "::error::no doctests collected - --doctest-modules is not reaching the source tree"
            exit 1
          }
          echo "### Doctests (Python ${{ matrix.python }}): $N" >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          pct = float(root.get("line-rate", 0)) * 100
          print(f"### Coverage (Python ${{ matrix.python }}): **{pct:.1f}%**")
          PY

      - name: Upload coverage to Codecov
        # One version uploads, so the badge reflects a single run rather than
        # three racing to overwrite each other.
        if: matrix.python == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          # A public repo uploads tokenlessly; set CODECOV_TOKEN in repo
          # secrets if the repo is private or rate-limited.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: CLI entry points respond
        run: |
          python run_scraper.py --help > /dev/null
          python discover.py --help  > /dev/null
          python capture.py --help   > /dev/null
          python crawler.py --help   > /dev/null   # deprecation shim

      - name: Web app serves on the example profile
        # Boots the real server, exercises the API surface the UI depends
        # on, and asserts the front-end assets are cache-busted. No API key,
        # so nothing here can call Claude.
        run: |
          python webapp.py --port=5599 --no-open &
          for i in $(seq 1 45); do
            curl -sf -m 2 http://127.0.0.1:5599/api/stats > /dev/null && break
            sleep 1
          done
          python - <<'PY'
          import json, re, urllib.request
          def get(path):
              with urllib.request.urlopen(f"http://127.0.0.1:5599{path}", timeout=10) as r:
                  return r.status, r.headers, r.read().decode()
          for path in ("/api/stats", "/api/jobs", "/api/pipeline",
                       "/api/companies", "/api/tracks", "/api/config",
                       "/api/run/status"):
              st, _, body = get(path)
              assert st == 200, (path, st)
              json.loads(body)
              print(f"{path:20} 200")
          st, hdrs, html = get("/")
          assert st == 200
          assert re.search(r'/static/js/app\.js\?v=\w+', html), "assets not cache-busted"
          assert hdrs.get("Cache-Control") == "no-store", hdrs.get("Cache-Control")
          _, ahdrs, _ = get("/static/js/app.js")
          assert ahdrs.get("Cache-Control") == "no-store"
          tracks = json.loads(get("/api/tracks")[2])
          assert tracks, "no tracks configured"
          print("tracks:", [t["id"] for t in tracks])
          PY

  build:
    name: Build (${{ matrix.os }})
    # Gated on the tests: a green build of broken code is not worth the
    # three-OS compile time.
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # One version for the binaries — the matrix here is OS, not Python,
          # and Nuitka support tends to trail new releases.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # envs/requirements-dev.txt is where the Nuitka floor is written
        # down (with zstandard, which --onefile needs to compress the
        # payload); installing it here rather than `requirements.txt
        # nuitka` means the build job cannot quietly drift onto an older
        # Nuitka than the one build_app.py's flags were checked against.
        # It is the same file the test job installs, so there is one
        # source of truth for the pin.
        run: |
          python -m pip install --upgrade pip
          pip install -r envs/requirements-dev.txt

      - name: Cache the Nuitka compiler downloads + ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/AppData/Local/Nuitka/Nuitka/Cache
            ~/Library/Caches/Nuitka
          key: nuitka-${{ matrix.os }}-py312-${{ hashFiles('envs/requirements.txt') }}
          restore-keys: nuitka-${{ matrix.os }}-py312-

      - name: Build the standalone app
        # --report writes Nuitka's inclusion report: every module, data
        # file and DLL that made it into the binary, and the reason each
        # one was pulled in. Every packaging surprise this project has
        # hit would have been visible there without a rebuild -- the
        # missing sqlite3.dll when the conda env was not on PATH
        # (JobHarvester.exe, 2026-09-10), fake_useragent's
        # data/browsers.jsonl, and the ddgs engine modules that are only
        # found by walking the package directory. --report-diffable
        # leaves out timestamps and absolute paths, so two runs' reports
        # can be diffed to see what a dependency bump actually changed.
        # build_app.py passes any --flag it does not recognise straight
        # through to Nuitka, so these go on the command line.
        run: python build_app.py --report=jobcrawlerui.report.xml --report-diffable

      - name: Smoke-launch the built binary
        # A build that compiles but can't boot is not a passing build: run
        # the real binary and require the API to answer. It has no
        # profile.toml, so this also proves the bundled example is enough
        # for a first run on a fresh machine.
        shell: bash
        run: |
          BIN=JobCrawlerUI.exe
          [ -f "$BIN" ] || BIN=job-crawler-ui
          ./"$BIN" --port=5601 --no-open &
          for i in $(seq 1 60); do
            curl -sf -m 2 http://127.0.0.1:5601/api/stats > /dev/null && break
            sleep 1
          done
          curl -sf -m 10 http://127.0.0.1:5601/api/stats | head -c 400
          echo
          curl -sf -m 10 http://127.0.0.1:5601/ | grep -q 'app.js?v=' \
            && echo "OK: built binary serves the cache-busted UI"

      - name: Build the harvester
        # The second binary ships too, so it has to be built where it is
        # released from. It is also the cheaper build by far: --target
        # harvest drops flask, playwright, ddgs, fake_useragent and primp
        # (HARVEST_SKIP in build_app.py), which is roughly three quarters
        # of the UI payload.
        run: python build_app.py --target harvest --report=jobharvester.report.xml --report-diffable

      - name: Smoke-launch the harvester binary
        # --help is the whole smoke test: harvest.py parks on a timer and
        # every other mode wants a store, while --help returns 0 without
        # touching one. It is not a no-op -- harvest.py imports
        # `src.config` at module level and src/config/profile.py loads a
        # profile at import, so this proves the compiled entry point
        # boots AND that the bundled profile.example.toml landed in the
        # binary and parses. It would have caught the sqlite3.dll build
        # (2026-09-10), which compiled fine and died on import.
        shell: bash
        run: |
          BIN=JobHarvester.exe
          [ -f "$BIN" ] || BIN=job-harvester
          ./"$BIN" --help
          echo "OK: harvester binary starts"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: job-crawler-${{ matrix.os }}
          path: |
            JobCrawlerUI.exe
            job-crawler-ui
            JobHarvester.exe
            job-harvester
          retention-days: 7

      - name: Upload the Nuitka inclusion reports
        # Kept as their own artifact rather than mixed in with the
        # binaries: they are the thing you download to answer "why is
        # this 189 MB" or "did that data file ship", and nobody wants a
        # 190 MB download to read an XML file. `if: always()` because a
        # report from a build that FAILED is the most useful one there
        # is.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-reports-${{ matrix.os }}
          path: |
            jobcrawlerui.report.xml
            jobharvester.report.xml
          retention-days: 7
          if-no-files-found: warn

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare assets
        # Both binaries are released together. They share a store and a
        # profile, so a release that shipped only the UI would leave
        # anyone running the harvester on whatever build they happened to
        # have, against a schema the UI had already moved on from.
        run: |
          mkdir release
          mv artifacts/job-crawler-ubuntu-latest/job-crawler-ui release/job-crawler-linux
          mv artifacts/job-crawler-windows-latest/JobCrawlerUI.exe release/JobCrawlerUI.exe
          mv artifacts/job-crawler-macos-latest/job-crawler-ui release/job-crawler-macos
          mv artifacts/job-crawler-ubuntu-latest/job-harvester release/job-harvester-linux
          mv artifacts/job-crawler-windows-latest/JobHarvester.exe release/JobHarvester.exe
          mv artifacts/job-crawler-macos-latest/job-harvester release/job-harvester-macos
          chmod +x release/job-crawler-linux release/job-crawler-macos
          chmod +x release/job-harvester-linux release/job-harvester-macos

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/job-crawler-linux
            release/JobCrawlerUI.exe
            release/job-crawler-macos
            release/job-harvester-linux
            release/JobHarvester.exe
            release/job-harvester-macos
          generate_release_notes: true
          draft: false
          prerelease: false
