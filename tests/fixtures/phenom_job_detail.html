e based on assessment of the patient's baseline needs and response to care. Delegate tasks and supervise the activities of other licensedand unlicensed care providers. Assist other nursing personnel in the delivery of nursing care and act as team leader or charge nurse for a group of patients or an entire unit as assigned. Monitor and initiate corrective action to maintain the environmentof care including equipment and material resources. Participate in own professional development by maintaining required competencies, identifying learning needs and seeking appropriate assistance or educational offerings. Act as preceptor and support thedevelopment of other staff and formal learners. Participate in the identification of clinical or operational performance improvement opportunities and in performance improvement activities. Perform other related duties incidental to the work described herein. </p> <br/> <h3>  Knowledge, Skills and Abilities </h3> <p>  Knowledge of scope of the registered nurse, licensed practical nurse and unlicensed staff Knowledge of and appropriate application of the nursing process Knowledge of professional theory, practice and procedure Ability to assess nursing needs of acute and chronically ill patients and their families Ability to independently seek out resources and work collaboratively Ability to establish and maintain effective working relationships Ability to communicate clearly with patients, families, visitors, healthcare team, physicians, administrators, leadership and others Ability to teach patients and families in accordance with the nursing plan of care Ability to use sensory and cognitive functions to process and prioritize information, treatment, and follow-up Ability to use fine motor skills Competent in BLS and/or other specialized life support requirements designated by work area Ability to record activities, document assessments, plan of care, interventions, evaluation and re-evaluation of patient status Ability to use compu
