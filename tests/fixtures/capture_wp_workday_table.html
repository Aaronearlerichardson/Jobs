<!-- A company's own WordPress careers page whose job table is rendered in
     the browser by a theme script that proxies the company's Workday tenant
     (a plain fetch gets an empty <div id="workday-job-list">). Saved from a
     browser the table is in the DOM: one <tr> per posting, three cells that
     each link the same Workday job URL (title / type / location).
     Reconstructed from that theme script's own row template (read from the
     live site, 2026-09-02); the company and postings are invented. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Positions | Acme Diagnostics</title>
<link rel="canonical" href="https://www.acmedx.com/careers/jobs/">
</head>
<body>
<nav><a href="https://www.acmedx.com/careers/">Careers</a> <a href="https://www.acmedx.com/about/">About</a></nav>
<div id="workday-job-search">
<form class="srSearchForm"><input id="filter-by" class="srSearchInput" placeholder="Filter by title, expertise"></form>
<div class="pt-4"><p>Not seeing the right fit today?</p>
<a class="link--text" href="https://crm.example.invalid/community/signup/abc" rel="nofollow">Join Our Talent Community</a></div>
</div>
<div id="workday-job-list" class="px-lg-0">

<th class="srJobListTypeOfEmployment"><nobr>Type of Employment</nobr></th>

</tr>
</thead>
<tbody>

</td>

</td>
<td class="srJobListLocation " title="Research Triangle Park, NC">

</tr>
