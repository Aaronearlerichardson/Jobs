# Notes:
#     Every posting's URL is the board's one /jobs page, so the stored job
#     id names a posting and closure is board membership. The API 401s
#     without a same-origin Referer.

sweep = true

[[detect]]
host = "hibob.com"
re = ['(?i)([a-z0-9][a-z0-9-]+)\.careers\.hibob\.com']

# Every posting's URL is the board's one /jobs page: the stored job
# id is what names a posting (closure by board membership).
[job_ref]
re = '(?i)//([a-z0-9-]+)\.careers\.hibob\.com/jobs'
parts = ["slug"]

[listing]
url = "https://{slug}.careers.hibob.com/api/job-ad"
# The API 401s without a same-origin Referer.
headers = { Referer = "https://{slug}.careers.hibob.com/" }
decoder = { entries = "jobAdDetails" }

[listing.fields]
id = { format = "hibob_{slug}_{id:12}" }
title = "title"
url = { format = "https://{slug}.careers.hibob.com/jobs" }
location = { join = [{ first = ["site", "country"] }, "workspaceType"], sep = " - " }
description = { of = "description", transform = "html_text" }
posted_at = "publishedAt"
remote_hint = { const = "hibob:workspaceType", when = { eq = ["workspaceType", "remote"] } }
department = "department"

[closure]
via = "listing"
