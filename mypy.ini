[mypy]
# Reads pydantic models as their constructors: Field defaults, aliases.
plugins = pydantic.mypy
files = src
strict = True
# The one strict flag left off: the facades (store, config, net) import a name
# to re-export it, and this flag wants each of ~440 of them named again in an
# `__all__`, which tests/test_invariants.py's single-reader rules would then
# have to read around.
no_implicit_reexport = False
warn_unreachable = True
# possibly-undefined and redundant-expr found an EngineRow.id typed str that is
# None whenever a spec names no id. unused-awaitable stays off: it flags
# TaskGroup.create_task, which the group itself keeps (test_every_task_is_kept).
enable_error_code = ignore-without-code, truthy-bool, possibly-undefined, redundant-expr

[mypy-lxml.*]
ignore_missing_imports = True

[mypy-html5lib.*]
ignore_missing_imports = True

[mypy-winotify.*]
ignore_missing_imports = True

[mypy-duckduckgo_search.*]
ignore_missing_imports = True
