[pytest]
testpaths = tests
addopts = -q --strict-markers
# The suite is offline by contract: no network, no Claude API, no writes to
# your real profile or store. Anything that needs those belongs in a
# preview crawl, not here.
filterwarnings =
    error::DeprecationWarning:core.*
    error::DeprecationWarning:scrapers.*
    error::DeprecationWarning:webapp.*
