[pytest]
# Two kinds of test run out of one command.
#
#   tests/            the fixture-backed suite (network, DB and LLM stubbed)
#   everything else   doctests embedded in the source, via --doctest-modules
#
# `testpaths` has to name the SOURCE trees explicitly: --doctest-modules only
# collects from paths pytest is pointed at, so leaving `testpaths = tests`
# would silently run zero doctests. See docs/DOCSTRINGS.md for the rule the
# doctests enforce.
#
# Root-level modules are listed one by one on purpose: `.` would recurse into
# the Nuitka build dirs and the local data/ store.
# tests/test_invariants.py asserts this list stays complete.
testpaths =
    tests
    src
    tools
    build_app.py
    capture.py
    crawler.py
    discover.py
    harvest.py
    run_scraper.py
    webapp.py
addopts = -q --strict-markers --doctest-modules
# The suite is offline by contract: no network, no Claude API, no writes to
# your real profile or store. Anything that needs those belongs in a
# preview crawl, not here. Doctests inherit that contract — a docstring
# example may not reach the network either.
filterwarnings =
    error::DeprecationWarning:src.*
