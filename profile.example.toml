# ---------------------------------------------------------------------------
# YOUR SEARCH, in one file.
#
# This is the template. On first run the app copies it to your own
# profile.toml in your per-user data directory (run `python run_scraper.py
# --where` to see exactly where) — edit THAT copy, by hand or in the web UI's
# Settings tab. The repository never holds your version.
#
# Nothing below is required to be filled in perfectly. Start with [keywords],
# [locality], and [candidate]; the rest has working defaults.
#
# Relevance model: a job is relevant if it matches ANY `core` term, OR matches
# a `domain` term AND a `skill` term. Keep `core` narrow (high-signal); let
# `domain` + `skill` pull in adjacent roles without opening the floodgates.
# ---------------------------------------------------------------------------

[keywords]
# Tier 1 — any single hit => relevant. Your field's unambiguous signals.
core = [
    "machine learning engineer", "data engineer", "backend engineer",
    "site reliability", "platform engineer",
]
# Tier 2 — adjacent domains. Needs a `skill` pair to pass.
domain = [
    "fintech", "healthtech", "climate", "robotics", "logistics",
]
# Tier 3 — transferable skills. Only count paired with a `domain` term.
skill = [
    "python", "golang", "kubernetes", "distributed systems",
    "data pipeline", "machine learning",
]

# ---------------------------------------------------------------------------
# Per-track keyword overrides. The table name must match a [tracks.<id>] id
# below. `keyword_mode` on that track decides whether these ADD to the tiers
# above ("extend") or REPLACE them ("replace") while that track runs.
# ---------------------------------------------------------------------------
[keywords.local]
# Extends the tiers above (this track's engine default is "extend").
core = ["staff engineer", "principal engineer"]
domain = ["marketplace", "developer tools"]
skill = ["typescript", "postgres", "terraform"]

[keywords.remote]
# REPLACES the tiers above (the sweep engine's default is "replace"), so list
# everything this track should match, not just additions. A wide net needs a
# tight core: this track gates on CORE terms alone.
core = ["distributed systems", "database internals", "compilers"]
domain = ["infrastructure", "developer platform", "observability"]
skill = ["rust", "go", "kubernetes", "postgres"]

[exclude]
phrases = ["phd required", "must have a phd", "clearance required"]
title_phrases = ["manager", "director", "intern"]
# Regex fragments (ORed together) scrubbed from text before keyword/exclusion
# matching — for boilerplate that contains domain-looking words without
# meaning them (benefits sections, EEO statements, "system health" prose).
boilerplate_phrases = [
    'medical[,/&\s]+(?:dental|vision)',
    'health\s+(?:insurance|savings|benefits?)',
    '(?:system|service|platform)\s+health',
]

# Per-track exclusions. Table name matches a [tracks.<id>] id; applied only
# while that track runs, and only when its `exclude_gate` is on.
[exclude.local]
# Job kinds you never want, matched anywhere in the posting.
role_phrases = ["data entry", "sales development representative"]
# Short abbreviations that only make sense in a title.
title_tokens = ["sdr", "bdr"]
# One hit is enough to drop the posting.
defense_strong = ["weapons", "munitions", "electronic warfare"]
# Innocent alone — two DIFFERENT hits are needed to drop a posting.
defense_weak = ["defense", "military", "combat"]
# Off-topic industries to drop even when they use your keywords.
nonclinical = ["blockchain", "cryptocurrency", "sportsbook"]

[locations]
onsite = ["san francisco", "sf", "bay area", "oakland", "berkeley"]
remote = ["remote", "work from home", "wfh", "fully remote", "distributed", "anywhere"]
accept_remote = true
exclude = []

# Remote-eligibility detection (core/remote_filter.py). Falls back to
# built-in generic defaults when left empty.
remote_tokens = []
remote_phrases = []
hard_negations = []
us_markers = []
non_us_regions = []

# ---------------------------------------------------------------------------
# Tracks — the searches you switch between in the web UI's header dropdown.
#
# A track is pure configuration run through ONE pipeline (scrapers/runner.py).
# Each [tracks.<id>] table defines: which SQLite DB it reads (`db`, relative
# to your data dir), the jobs.track value (`track`), ranking knobs (`rank_by`,
# `min_mission`), and the UI filter defaults applied when you switch to it
# (`min_fit_default` for the fit slider, `willing_to_move_default` for the
# relocate checkbox). `remote_requires_watch = true` hides remote rows unless
# the company is trusted with an out-of-area exception (a precision rule for
# location-focused tracks); `remote_mission_floor` says which unwatched
# companies earn that trust. `default = true` marks the track the UI opens on.
#
# The ids, labels, and DBs are yours to rename. Omit the whole [tracks]
# section for the built-in two-track default (the same two shown here).
#
# Two tracks is a common shape but not a rule: run one track, or five. The
# pair below is the classic "same search, two postures" setup — one that
# holds your location and relaxes the subject matter, one that holds the
# subject matter and relaxes location.
# ---------------------------------------------------------------------------
[tracks.local]
label = "Local"
db = "jobs.db"
track = "local"
# `engine` names the crawl MACHINERY, not the track:
#   "local" — location-scoped: asks each board for your region, so it stays
#             cheap even against huge employers. Geo-gated.
#   "sweep" — location-agnostic: whole boards plus aggregator feeds and web
#             search, gated hard on your CORE keywords. (Older profiles may
#             say "neural" here; it still resolves to "sweep".)
# Engines are fixed code paths, and web UI operations enable themselves by
# engine — so a track id can be anything, but the engine must be one of these.
engine = "local"
rank_by = "fit"
min_mission = 0.2
min_fit_default = 0.0
willing_to_move_default = false
remote_requires_watch = true
default = true
# ---------------------------------------------------------------------------
# Crawl methodology — every knob below defaults from `engine`, so omit what
# you don't need to change. These keys ARE the difference between tracks.
# ---------------------------------------------------------------------------
# keyword_mode = "extend"      # "extend": [keywords.<id>] ADDs to the global
#                              # tiers; "replace": they BECOME the tiers
# accept_remote = false        # allow remote listings through the fetch filter
# sources = { store = true, priority_companies = false, aggregators = false, websearch = false, location_scoped = true }
#   # store: active companies from this track's DB
#   # priority_companies: [discovery] priority_companies, fetched first
#   # aggregators: [sources] forums/RSS/RemoteOK/Remotive/HN feeds
#   # websearch: the [sources].websearch queries
#   # location_scoped: store boards fetched through the [locality] filter
#   #   (whole-board for watched companies); false = lightweight ATS sweep
# store_tag = ""               # only sweep store companies with this tag
#                              # ("local" / "sweep" / "watch"; core/tags.py)
# require_core_anchor = false  # gate: posting must hit a CORE keyword
# geo_gate = true              # gate: drop non-local, non-remote postings
# remote_mission_floor = 0.85  # a company at or above this mission score is
#                              # treated like a watched one for REMOTE work:
#                              # its whole board is fetched, its explicitly
#                              # remote postings survive the geo gate, and
#                              # they enter the location-scoped ranking. The
#                              # watch list is hand-maintained and lags the
#                              # data, so core-mission employers nobody has
#                              # starred yet still get seen. Multi-division
#                              # conglomerates ([policy] multi_division) never
#                              # qualify this way. Costs whole-board fetches:
#                              # each 0.05 you drop the floor adds boards to
#                              # every run. `false` turns it off.
# verify_top = 15              # deep-verify the top N after scoring (0 = skip)
# cost_guard = 0               # max postings scored per run w/o confirm (0 = off)
# email = false                # email the digest after each crawl
# digest_min_fit = 0.4         # emailed digest carries only rows first seen
#                              # this run scoring at least this fit; the
#                              # written digest stays unfiltered
# notify = false               # also raise a Windows desktop toast when a
#                              # digest goes out (needs the optional
#                              # `winotify` package; no-op without it)
# exclude_gate = true          # apply the [exclude.<id>] role/defense tables
# dormant_after = 4            # after this many consecutive EMPTY DAYS a
#                              # company goes dormant: still crawled, but
#                              # weekly instead of every run (a roster of 300
#                              # had 181 companies that had never produced a
#                              # single job). One non-empty fetch wakes it,
#                              # and "watch"-tagged companies never sleep.
# dormant_days = 7             # how long a dormant company is skipped before
#                              # its next retry
# tech_title_regex = "..."     # the technical-title gate (case-insensitive
#                              # regex a title must match before scoring spend).
#                              # The default is broad and field-neutral; set
#                              # this if your field's titles don't look like
#                              # engineering titles.

[tracks.remote]
label = "Remote"
db = "jobs.db"
track = "remote"
engine = "sweep"
rank_by = "fit"
min_fit_default = 0.5
willing_to_move_default = true
remote_requires_watch = false
# sweep-engine defaults: keyword_mode="replace", require_core_anchor=true,
# geo_gate=false, store_tag="sweep", cost_guard=300,
# sources = { store=true, priority_companies=true, aggregators=true, websearch=true, location_scoped=false }

[policy]
# Large companies to keep active despite an "other" mission score, crawling
# only their aligned roles. Leave empty if you don't want special-casing.
multi_division = []
multi_division_mission_floor = 0.6

# Honor robots.txt (default true). Turning this off disables the check, not
# the connection pooling or the per-host Crawl-delay pacing.
# respect_robots = true

# Hosts to crawl WITHOUT consulting robots.txt while respect_robots stays
# on. Crawl-delay pacing still applies. Lowercase hostnames; a leading dot
# matches every subdomain. Use it for machine-facing endpoints on a host
# whose robots.txt blanket-disallows `*` for the HTML site's sake:
# SmartRecruiters' public postings API (api.smartrecruiters.com publishes
# `Disallow: /` for everyone but LinkedInBot) and PeopleAdmin's Atom feed
# (<tenant>/postings/all_jobs.atom, whose host disallows `*` for the HTML
# site's sake). Each entry is your call to make about that host, so the
# list is empty by default.
#
# ".peopleadmin.com" covers the hosted university tenants
# (unc.peopleadmin.com), which discover.py --add-board can register from the
# board URL. A university that serves PeopleAdmin from its own domain is a
# separate decision and needs its own entry — NC State's board is
# jobs.ncsu.edu, has no ATS signature to detect, and is registered by hand.
# See the PeopleAdmin bullet in README.md for both.
# robots_exempt_hosts = ["api.smartrecruiters.com", ".peopleadmin.com"]

# robots.txt fetch timeout, split into (connect, read) seconds.
#
# Discovery probes speculative `careers.<name>.com` hosts. The ones whose
# parent domain has wildcard DNS resolve to an edge that never completes a
# handshake and burn the whole connect timeout; real boards connect in well
# under half a second. Raise the connect value if you crawl over a slow or
# high-latency link and start seeing "unreachable (ConnectTimeout)" for hosts
# you know are live.
#
# Leave the read timeout generous: a host that connects promptly but is slow
# to serve robots.txt is a real server with a real policy, and giving up early
# means crawling something that asked you not to.
robots_connect_timeout = 3.0
robots_read_timeout = 10.0

# Headless-browser resolution order for the JS probes (JS-rendered careers
# pages that hide their ATS behind a script). "" is Playwright's own pinned
# build, from `playwright install`; the others are browsers already on the
# machine. Keeping the system browsers in the list means `pip install` alone
# is enough — no 100 MB+ download — and is what lets the probes work on CI
# runners. Reorder to prefer a system browser, or set to [""] to use only
# Playwright's own build.
browser_channels = ["", "chrome", "msedge"]

# ---------------------------------------------------------------------------
# Who you are — injected verbatim into every scoring/discovery prompt. This is
# the single highest-leverage block in the file: the scorer judges every
# posting against it. Write it the way you'd brief a recruiter.
# ---------------------------------------------------------------------------
[candidate]
summary = "A senior software/data engineer targeting backend, ML, and platform roles at mission-driven companies."
strengths = [
    "Backend & distributed systems engineering (Go, Python, Kubernetes, event-driven architectures).",
    "Data pipeline & analytics engineering (SQL, dbt, Spark, warehouse modeling).",
    "Cloud infrastructure & reliability (Terraform, CI/CD, observability).",
]
fit_caps = [
    "If the role is pure people-management with no hands-on engineering: cap fit at 0.45.",
    "If the job description is missing or trivially short: judge from the title alone and cap fit at 0.45.",
]
avoid = "Avoid roles requiring an active security clearance or a PhD."
# Your résumé drives per-job fit scoring. Put the file in your data directory
# and either name it `resume.docx` (found automatically) or point at it here —
# a filename relative to the data dir, or an absolute path. .docx, .txt, and
# .md are readable; PDF is not. With no résumé, fit scoring simply turns off.
# resume = "resume.docx"

# ---------------------------------------------------------------------------
# Mission taxonomy — how much you care about WHO the employer is, as a ladder,
# highest first. Judged once per company (not once per job) and cached, then
# combined with résumé fit for the ranking. Rename/reorder tiers freely. The
# LAST tier is typically the inactive catch-all. `band` = score range;
# `active` = whether to crawl that tier at all.
# ---------------------------------------------------------------------------
[mission]
tiers = [
    { name = "core-mission",   desc = "companies whose core product is exactly what you want to work on", band = [0.75, 1.00], active = true },
    { name = "adjacent",       desc = "companies in an adjacent domain where your skills transfer well", band = [0.45, 0.75], active = true },
    { name = "other",          desc = "everything else", band = [0.00, 0.30], active = false },
]
# Optional: pin companies whose NAME matches this regex to (bullseye_tier, 1.0).
# Leave empty to disable. Use a TOML literal string (single quotes) for regexes.
bullseye_regex = ''
bullseye_tier  = "core-mission"

# ---------------------------------------------------------------------------
# Locality — what counts as "local" for a location-scoped track. Name every
# way your area shows up in a job posting: the metro, its towns, the state.
# ---------------------------------------------------------------------------
[locality]
name = "San Francisco Bay Area"
# Short/ambiguous tokens, matched on word boundaries so "sf" can't fire
# inside "surf".
word_tokens = ["sf", "ca"]
# Distinctive names, matched as plain substrings.
substrings = ["san francisco", "bay area", "oakland", "berkeley", "palo alto", "mountain view", "san jose"]
# Recognises a "City, ST" address.
state_suffix = ["ca", "california"]

# ---------------------------------------------------------------------------
# Non-company job sources. The feeds below carry every kind of role and are
# filtered by YOUR keywords, so the generic ones ship on. The forum and
# web-search lists are empty by default: they encode a specific field's
# vocabulary, and a generic guess would only waste requests.
# Used by tracks whose `sources.aggregators` / `sources.websearch` are on.
# ---------------------------------------------------------------------------
[sources]
remoteok = true              # remoteok.com/api
remotive = true              # remotive.com/api/remote-jobs
remotive_category = ""       # "software-dev", "data", ... ("" = all)
hnhiring = true              # HN "Ask HN: Who is hiring?" threads
hnhiring_max_threads = 2     # current + previous month

# Discourse forums with a jobs category. Find `category_id` at
# <forum>/categories — it's the number in the category's URL.
discourse = [
    # { label = "Some Community Jobs", url = "https://forum.example.org", category_id = 9 },
]

# RSS/Atom job feeds. OMIT this key to keep the built-in general remote-job
# feeds; set it to [] to turn RSS off entirely; list your own to replace them.
# rss = [
#     { label = "Society job board", url = "https://example.org/jobs/feed", location = "Remote" },
# ]

# Web searches whose result pages are parsed for job postings. Write them the
# way you'd type them into a search engine; `site:` narrows to one board.
websearch = [
    # { label = "My field on WeWorkRemotely", max_results = 12, query = '("term a" OR "term b") ("engineer" OR "scientist") site:weworkremotely.com' },
]

# USAJOBS — every federal opening, which nothing else here can see: an agency
# lab or field office runs no ATS to put in your roster and files nothing with
# the state job bank. Worth turning on if any federal campus is near you.
#
# Needs a free key. Register at https://developer.usajobs.gov/apirequest/,
# then set BOTH env vars (the email must be the address you registered — the
# API takes it as the User-Agent and rejects a key sent with any other):
#     [Environment]::SetEnvironmentVariable("USAJOBS_API_KEY", "...", "User")
#     [Environment]::SetEnvironmentVariable("USAJOBS_EMAIL", "you@example.com", "User")
#
# Applies to EVERY track, not only ones with `sources.aggregators` on: the
# search is location-scoped by construction, which is what a local track
# wants. Off until you set `enabled = true`.
[sources.usajobs]
enabled = false
keyword = ""                 # free text; "" = rely on `series` alone
location = ""                # "Research Triangle Park, North Carolina"
radius = 50                  # miles around `location`
results_per_page = 250       # API max is 500
# Occupational series codes — the real filter, and worth getting right. Browse
# them at https://www.opm.gov/policy-data-oversight/classification-qualifications/
# OMIT this key for the built-in technical set (2210 IT management, 1550
# computer science, 0601 general health science, 0401 general biological
# science); set it to [] to search every series.
# series = ["2210", "1550", "0601", "0401"]

# ---------------------------------------------------------------------------
# Discovery — how the roster of companies to crawl gets built (discover.py).
# Everything here is a starting pool; each name is probed for a real job board
# and locality-checked before it's added, so over-listing is cheap.
# ---------------------------------------------------------------------------
[discovery]
# Employers you already know belong in the roster. A bare name, or a name
# with a note to remind you why it's here. You do NOT need to know their ATS.
seed_companies = [
    # "Example Health",
    # { name = "Example Labs", notes = "the big employer everyone forgets" },
]
# Optional: only merge those seeds into discovery runs whose term mentions one
# of these (usually your region). Omit to always merge them.
seed_triggers = []
workday_majors = []          # big employers to also try via the Workday fallback
directory_urls = []          # e.g. a local chamber/association "/company/<slug>/" directory
# The main recall lever — searches whose results are harvested for names, then
# probed. Tailor to your region/field.
name_search_queries = [
    "tech companies in <your city>",
    "<your industry> startups <your region>",
]
name_blocklist = []          # normalized names to drop (bad slug collisions)
# How many names discover_local's bulk pass will websearch-resolve per run,
# after probe+sniff leave them unboarded (DDG rate-limits, so this is capped
# rather than run over the whole gather). Omit for the built-in default (20).
# websearch_cap = 20

# Job aggregators / company-directory sites skipped when picking result URLs
# to resolve during discovery (they're never the employer's own job board).
aggregator_hosts = []
# Generic words excluded when matching a search-result host to a company
# name (so "medicaljobs.com" doesn't match on the word "medical").
generic_name_words = []
# Named company targets fetched (and deduped) FIRST by tracks whose
# `sources.priority_companies` is on.
priority_companies = [
    # { name = "Example Co", ats = "greenhouse", slug = "examples" },
]

# ---------------------------------------------------------------------------
# Fit rubric (core/fit.py) — optional; fit.py falls back to built-in defaults
# when this whole block is absent. Tune it once your first digests are in and
# you can see which axis is misjudging you.
# ---------------------------------------------------------------------------
[fit]
# Deterministic backstop for the "clearance" gate: verbs are the demand
# words, qualifiers are the optional clearance-type words that may sit
# between the verb and "clearance". Falls back to built-in defaults
# (active/current + us/dod/top-secret/ts-sci/secret) when left empty.
clearance_verbs = []
clearance_qualifiers = []
