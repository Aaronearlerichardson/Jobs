# tombi (https://tombi-toml.github.io/tombi): the layout of the board specs,
# src/config/boards/*.toml. CI runs `tombi format --check` on them.
[format.rules]
line-width = 100
indent-width = 4

# The board specs' JSON Schema (generated: python tools/board_catalog.py),
# for completion and hover docs in an editor with the Tombi extension, and
# for `tombi lint` in CI. _order.toml is no spec.
[[schemas]]
path = "src/config/boards/board-spec.schema.json"
include = ["src/config/boards/[a-z]*.toml"]
